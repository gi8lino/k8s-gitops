---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: disable-direct-login
  namespace: wiki
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: wiki-external
  lua:
    - type: ValueRef
      valueRef:
        group: v1
        kind: ConfigMap
        name: wiki-external-access-controls
