---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: garage-backup-ingress-webui
  namespace: garage-backup
spec:
  description: Allow the Garage Web UI to access Garage APIs
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: garage-backup
      app.kubernetes.io/name: garage
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: garage-webui
            "k8s:io.kubernetes.pod.namespace": garage-backup
      toPorts:
        - ports:
            - port: "3900"
              protocol: TCP
            - port: "3903"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
            gateway.envoyproxy.io/owning-gateway-namespace: network
            "k8s:io.kubernetes.pod.namespace": network
      toPorts:
        - ports:
            - port: "3900"
              protocol: TCP
