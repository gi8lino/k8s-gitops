---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: garage-backup-ingress-k8up
  namespace: garage-backup
spec:
  description: Allow K8up backup jobs to access Garage backup storage
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: garage-backup
      app.kubernetes.io/name: garage
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.cilium.k8s.namespace.labels.k8up: backup-enabled
            k8upjob: "true"
      toPorts:
        - ports:
            - port: "3900"
              protocol: TCP
