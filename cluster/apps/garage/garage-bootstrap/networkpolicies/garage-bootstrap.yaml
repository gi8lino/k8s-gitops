---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: garage-bootstrap
  namespace: garage-backup
spec:
  description: Allow Garage bootstrap traffic
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: garage-bootstrap
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            "k8s:io.kubernetes.pod.namespace": kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
          rules:
            dns:
              - matchPattern: "*"
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: garage-backup
            app.kubernetes.io/name: garage
            "k8s:io.kubernetes.pod.namespace": garage-backup
      toPorts:
        - ports:
            - port: "3903"
              protocol: TCP
