---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage-webui
  namespace: garage-backup
  labels:
    app.kubernetes.io/name: garage-webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: garage-webui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garage-webui
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: garage-webui
          image: genebit/garage-webui@sha256:70bad27066a1095b990986e26b4c1c187a05ae2b3be0efb3970fb684836efe00
          imagePullPolicy: IfNotPresent
          env:
            - name: API_BASE_URL
              value: http://garage-backup-admin.garage-backup.svc.cluster.local:3903
            - name: API_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-backup-admin
                  key: adminToken
            - name: S3_ENDPOINT_URL
              value: http://garage-backup.garage-backup.svc.cluster.local:3900
            - name: S3_REGION
              value: garage
          ports:
            - name: http
              containerPort: 3909
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: garage-webui-data
