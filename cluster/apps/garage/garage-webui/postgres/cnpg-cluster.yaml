---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: garage-webui-postgres
  namespace: garage-backup
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6
  storage:
    storageClass: nvme
    size: 5Gi
  bootstrap:
    initdb:
      database: garage_webui
      owner: garage_webui
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: garage-webui
