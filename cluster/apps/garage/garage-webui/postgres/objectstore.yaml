---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: garage-webui
  namespace: garage-backup
spec:
  retentionPolicy: 3d
  configuration:
    destinationPath: s3://garage-webui-db-backups
    endpointURL: http://garage-backup.garage-backup.svc.cluster.local:3900
    s3Credentials:
      accessKeyId:
        name: db-backup
        key: accessKey
      secretAccessKey:
        name: db-backup
        key: secretKey
      region:
        name: db-backup
        key: region
    wal:
      compression: gzip
    data:
      compression: gzip
