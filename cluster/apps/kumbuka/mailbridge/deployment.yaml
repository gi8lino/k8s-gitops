---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailbridge
  namespace: kumbuka
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mailbridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailbridge
    spec:
      containers:
        - name: mailbridge
          image: ghcr.io/kumbuka-me/mailbridge:v0.3.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
