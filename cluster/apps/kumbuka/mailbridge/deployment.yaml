---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailbridge
  namespace: kumbuka
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mailbridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailbridge
    spec:
      containers:
        - name: mailbridge
          image: ghcr.io/kumbuka-me/mailbridge:v0.3.0
          imagePullPolicy: IfNotPresent
          env:
            - name: MAILBRIDGE__LISTEN_ADDRESS
              value: "0.0.0.0:8080"
          envFrom:
            - secretRef:
                name: mailbridge-config
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
