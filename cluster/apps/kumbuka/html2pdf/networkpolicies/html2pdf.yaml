---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: html2pdf
  namespace: kumbuka
spec:
  description: "Policy for html2pdf"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: html2pdf
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: kumbuka
            app.kubernetes.io/component: kumbuka
            "k8s:io.kubernetes.pod.namespace": kumbuka
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
