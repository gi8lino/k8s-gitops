---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: kumbuka-postgres
  namespace: kumbuka
  annotations:
    monitoring.gitops/backup-max-age-seconds: "93600"
spec:
  schedule: "0 0 3 * * *"
  cluster:
    name: kumbuka-postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
