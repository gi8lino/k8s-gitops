---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitlab-garage
  namespace: gitlab
spec:
  interval: 20m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: ./script/helm/garage
      sourceRef:
        kind: GitRepository
        name: garage
        namespace: flux-system
      interval: 30m
  values:
    image:
      tag: v2.3.0
    deployment:
      replicaCount: 1
    garage:
      replicationFactor: "1"
      rpcBindAddr: "0.0.0.0:3901"
      s3:
        api:
          bindAddr: "0.0.0.0:3900"
          rootDomain: ".s3.${BASE_DOMAIN}"
        web:
          bindAddr: "0.0.0.0:3902"
          rootDomain: ".garage.${BASE_DOMAIN}"
      admin:
        apiBindAddr: "0.0.0.0:3903"
    persistence:
      data:
        size: 5Gi
      meta:
        size: 250Mi
