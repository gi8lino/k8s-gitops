---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: gitlab-postgres
  namespace: gitlab
  annotations:
    monitoring.gitops/backup-max-age-seconds: "93600"
spec:
  schedule: "0 0 5 * * *"
  cluster:
    name: gitlab-postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
