---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: gitlab-egress-garage-backup
  namespace: gitlab
spec:
  description: Allow GitLab application backups to access Garage backup storage
  endpointSelector:
    matchLabels:
      app: toolbox
      "k8s:io.kubernetes.pod.namespace": gitlab
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: garage-backup
            app.kubernetes.io/name: garage
            "k8s:io.kubernetes.pod.namespace": garage-backup
      toPorts:
        - ports:
            - port: "3900"
              protocol: TCP
