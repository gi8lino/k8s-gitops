apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: metube
  namespace: metube
spec:
  description: >-
    Allow MeTube to receive traffic only through the Cilium Gateway and
    access DNS plus the public internet for yt-dlp downloads.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: metube
  ingress:
    - fromEndpoints:
        - matchLabels:
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
            gateway.envoyproxy.io/owning-gateway-namespace: network
            "k8s:io.kubernetes.pod.namespace": network
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
