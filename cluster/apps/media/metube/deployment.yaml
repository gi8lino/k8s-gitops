---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metube
  namespace: media
  labels:
    app.kubernetes.io/name: metube
    app.kubernetes.io/component: web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: metube
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metube
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: metube
          image: ghcr.io/alexta69/metube:2026.09.28
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: "2000"
            - name: PGID
              value: "2000"
            - name: UMASK
              value: "022"
            # Do not let the MeTube entrypoint recursively chown
            # the Plex music directory.
            - name: CHOWN_DIRS
              value: "false"
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8081"
            # Normal/video downloads.
            #
            # Since this deployment is primarily for music, these
            # go to a temporary download directory.
            - name: DOWNLOAD_DIR
              value: /downloads
            # Final audio files go directly into Plex storage.
            - name: AUDIO_DOWNLOAD_DIR
              value: /music
            # Persistent MeTube application state.
            - name: STATE_DIR
              value: /state
            # Temporary yt-dlp/ffmpeg working files.
            - name: TEMP_DIR
              value: /tmp/metube
            - name: DEFAULT_THEME
              value: auto
            - name: MAX_CONCURRENT_DOWNLOADS
              value: "3"
            - name: DEFAULT_OPTION_PLAYLIST_ITEM_LIMIT
              value: "0"
            - name: OUTPUT_TEMPLATE
              value: "%(title)s.%(ext)s"
            - name: OUTPUT_TEMPLATE_PLAYLIST
              value: "%(playlist_title)s/%(playlist_index)03d - %(title)s.%(ext)s"
            - name: OUTPUT_TEMPLATE_CHANNEL
              value: "%(channel)s/%(title)s.%(ext)s"
            - name: CUSTOM_DIRS
              value: "true"
            - name: CREATE_CUSTOM_DIRS
              value: "true"
            - name: DOWNLOAD_DIRS_INDEXABLE
              value: "false"
            - name: ALLOW_PRIVATE_ADDRESSES
              value: "false"
            - name: ALLOW_YTDL_OPTIONS_OVERRIDES
              value: "false"
          ports:
            - name: http
              containerPort: 8081
          volumeMounts:
            - name: state
              mountPath: /state
            - name: temp
              mountPath: /tmp/metube
            - name: downloads
              mountPath: /downloads
            - name: music
              mountPath: /music
          resources:
            limits:
              memory: 2Gi
              ephemeral-storage: 45Gi
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - curl -fsS http://127.0.0.1:8081/ >/dev/null
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - curl -fsS http://127.0.0.1:8081/ >/dev/null
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: metube-state
        - name: temp
          emptyDir:
            sizeLimit: 20Gi
        # Only used if you accidentally/intentionally download video.
        # It does not need to survive pod replacement in a music-only setup.
        - name: downloads
          emptyDir:
            sizeLimit: 20Gi
        - name: music
          persistentVolumeClaim:
            claimName: music
