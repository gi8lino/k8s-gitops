---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metube
  namespace: media
  labels:
    app.kubernetes.io/name: metube
    app.kubernetes.io/component: web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: metube
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metube
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: metube
          image: ghcr.io/alexta69/metube:2026.09.29
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: metube
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          volumeMounts:
            - name: state
              mountPath: /state
            - name: temp
              mountPath: /tmp/metube
            - name: downloads
              mountPath: /downloads
            - name: music
              mountPath: /music
          resources:
            limits:
              memory: 2Gi
              ephemeral-storage: 45Gi
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - curl -fsS http://127.0.0.1:8081/ >/dev/null
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - curl -fsS http://127.0.0.1:8081/ >/dev/null
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: metube-state
        - name: temp
          emptyDir:
            sizeLimit: 20Gi
        - name: downloads
          emptyDir:
            sizeLimit: 20Gi
        - name: music
          persistentVolumeClaim:
            claimName: music
