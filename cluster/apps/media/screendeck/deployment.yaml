---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: screendeck
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: screendeck
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: screendeck
    spec:
      containers:
        - name: screendeck
          image: ghcr.io/gi8lino/screendeck:v0.10.0
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Europe/Zurich
            - name: SCREENDECK__BASE_URL
              value: https://screendeck.${BASE_DOMAIN}
            - name: SCREENDECK__EXCLUDE_LIBRARIES
              value: Fitness
            - name: SCREENDECK__DATABASE_PATH
              value: /data/screendeck.db
            - name: SCREENDECK__AUTH_KEY_PATH
              value: /data/auth.key
            - name: SCREENDECK__PLEX_URL_OVERRIDE
              value: http://plex:32400
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            timeoutSeconds: 2
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 3
            timeoutSeconds: 2
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
      restartPolicy: Always
      automountServiceAccountToken: false
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: screendeck-data
