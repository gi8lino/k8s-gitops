---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: garage-backup-ingress-keycloak-postgres
  namespace: garage-backup
spec:
  description: Allow Keycloak PostgreSQL backup traffic
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: garage-backup
      app.kubernetes.io/name: garage
  ingress:
    - fromEndpoints:
        - matchLabels:
            cnpg.io/cluster: keycloak-postgres
            cnpg.io/podRole: instance
            "k8s:io.kubernetes.pod.namespace": keycloak
      toPorts:
        - ports:
            - port: "3900"
              protocol: TCP
