---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-warden-webui
  namespace: keycloak
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8082
      targetPort: webui-http
      protocol: TCP
  selector:
    app.kubernetes.io/name: keycloak-warden-webui
    app.kubernetes.io/component: webui
