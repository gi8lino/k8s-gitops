---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - networkpolicies/
  - deployment.yaml
  - envoyextensionpolicy.yaml
  - httproute.yaml
  - persistentvolumeclaim.yaml
  - schedule.yaml
  - secret.yaml
  - service.yaml
  - serviceaccount.yaml
configMapGenerator:
  - name: keycloak-block-admin
    namespace: keycloak
    files:
      - lua=scripts/block-external-admin-access.lua
  - name: keycloak-snitch-init
    namespace: keycloak
    files:
      - scripts/install-snitch.sh
generatorOptions:
  disableNameSuffixHash: true
patches:
  - patch: |-
      - op: add
        path: /metadata/annotations
        value:
          kustomize.toolkit.fluxcd.io/substitute: disabled
    target:
      kind: ConfigMap
      name: keycloak-snitch-init
