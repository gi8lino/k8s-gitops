---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: block-admin-page
  namespace: keycloak
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: keycloak-external
  lua:
    - type: ValueRef
      valueRef:
        group: v1
        kind: ConfigMap
        name: keycloak-block-admin
