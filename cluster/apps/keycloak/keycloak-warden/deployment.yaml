---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak-warden
  namespace: keycloak
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak-warden
      app.kubernetes.io/component: keycloak-warden
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-warden
        app.kubernetes.io/component: keycloak-warden
    spec:
      securityContext:
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak-warden
          image: ghcr.io/gi8lino/keycloak-warden:v0.6.4
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - --config=/config/warden.yaml
            - --database=/data/warden.db
            - --listen-address=:8080
            - --management-listen-address=:8081
            - --metrics
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 0
          env:
            - name: WARDEN__SNITCH_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-snitch
                  key: KC_SPI_EVENTS_LISTENER__SNITCH__WEBHOOK_SECRET
          envFrom:
            - secretRef:
                name: keycloak-warden
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: management
              containerPort: 8081
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: management
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: management
            periodSeconds: 30
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: keycloak-warden-config
        - name: data
          persistentVolumeClaim:
            claimName: keycloak-warden-data
