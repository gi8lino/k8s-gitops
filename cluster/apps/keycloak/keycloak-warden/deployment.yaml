---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak-warden
  namespace: keycloak
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak-warden
      app.kubernetes.io/component: keycloak-warden
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-warden
        app.kubernetes.io/component: keycloak-warden
    spec:
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: Always
      initContainers:
        - name: never
          image: ghcr.io/containeroo/never:v0.12.5
          args:
            - --http.keycloak.address=https://keycloak:9000/health/started
            - --http.keycloak.skip-tls-verify=true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 10m
              memory: 16Mi
      containers:
        - name: keycloak-warden
          image: ghcr.io/gi8lino/keycloak-warden:v0.0.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
          envFrom:
            - secretRef:
                name: keycloak-snitch
            - secretRef:
                name: keycloak-warden
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: management
              containerPort: 8081
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: management
            initialDelaySeconds: 7
            timeoutSeconds: 1
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: management
            timeoutSeconds: 1
