---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-warden-config
  namespace: keycloak
data:
  warden.yaml: |
    rule:
      threshold: 5
      window: 1m
      ban: 15m
    targets:
      receiver:
        enabled: true
        provider: cloudflare
        zone-id: "env:CLOUDFLARE_ZONE_ID"
        secret: "env:CLOUDFLARE_API_TOKEN"
