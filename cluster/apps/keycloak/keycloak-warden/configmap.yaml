---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-warden-config
  namespace: keycloak
data:
  warden.yaml: |
    rule:
      threshold: 5
      window: 1m
      ban: 15m
    targets:
      cloudflare:
        edge:
          zone-id: env:CLOUDFLARE_ZONE_ID
          api-token: env:CLOUDFLARE_API_TOKEN
