---
rules:
  brute-force:
    selector:
      kind: user
      events: [LOGIN_ERROR]
    aggregation:
      group-by: ip
      threshold: 5
      window: 1m
    actions:
      ban: 15m
  password-spraying:
    selector:
      kind: user
      events: [LOGIN_ERROR]
    aggregation:
      group-by: ip
      distinct: user-id
      threshold: 10
      window: 5m
  distributed-attack:
    selector:
      kind: user
      events: [LOGIN_ERROR]
    aggregation:
      group-by: user-id
      distinct: ip
      threshold: 10
      window: 5m

enforcements:
  cloudflare:
    edge:
      zone-id: env:CLOUDFLARE_ZONE_ID
      api-token: env:CLOUDFLARE_API_TOKEN
  webhook:
    slack-bot:
      url: https://slack.com/api/chat.postMessage
      headers:
        Authorization: env:SLACK_AUTHORIZATION
      body-template: file:/config/templates/slack-bot.json.tmpl
      template-vars:
        channel: env:SLACK_CHANNEL
      response:
        json:
          pointer: /ok
          equals: true
          error-pointer: /error
