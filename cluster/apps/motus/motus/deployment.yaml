---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: motus
  namespace: motus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: motus
      app.kubernetes.io/component: motus
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: motus
        app.kubernetes.io/component: motus
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: never
          image: ghcr.io/containeroo/never:v0.12.3
          args:
            - --http.postgres.address=https://motus-postgres-healthz:8000/healthz
            - --http.postgres.skip-tls-verify=true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 10m
              memory: 16Mi
      containers:
        - name: motus
          image: ghcr.io/gi8lino/motus:v0.7.3
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Europe/Zurich
            - name: MOTUS__TRUSTED_PROXY_USER_HEADER
              value: X-Auth-Request-Email
            - name: MOTUS__AUTH_MODE
              value: trusted-proxy
            - name: MOTUS__DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: motus-postgres-app
                  key: uri
            - name: MOTUS__LISTEN_ADDRESS
              value: 0.0.0.0:8080
            - name: MOTUS__MANAGEMENT_LISTEN_ADDRESS
              value: 0.0.0.0:8081
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          startupProbe:
            httpGet:
              path: /healthz
              port: management
            failureThreshold: 30
            timeoutSeconds: 2
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: management
            failureThreshold: 2
            periodSeconds: 30
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 100m
      restartPolicy: Always
      automountServiceAccountToken: false
