---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: motus-postgres
  namespace: motus
  annotations:
    monitoring.gitops/backup-max-age-seconds: "93600"
spec:
  schedule: "0 30 3 * * *"
  cluster:
    name: motus-postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
