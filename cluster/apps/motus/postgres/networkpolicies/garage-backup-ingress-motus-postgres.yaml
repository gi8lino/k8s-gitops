---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: garage-backup-ingress-motus-postgres
  namespace: garage-backup
spec:
  description: Allow Motus PostgreSQL backup traffic
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: garage-backup
      app.kubernetes.io/name: garage
  ingress:
    - fromEndpoints:
        - matchLabels:
            cnpg.io/cluster: motus-postgres
            cnpg.io/podRole: instance
            "k8s:io.kubernetes.pod.namespace": motus
      toPorts:
        - ports:
            - port: "3900"
              protocol: TCP
