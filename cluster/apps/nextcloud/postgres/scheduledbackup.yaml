---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: nextcloud-postgres
  namespace: nextcloud
  annotations:
    monitoring.gitops/backup-max-age-seconds: "93600"
spec:
  schedule: "0 5 2 * * *"
  cluster:
    name: nextcloud-postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
