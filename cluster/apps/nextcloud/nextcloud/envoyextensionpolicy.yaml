kind: EnvoyExtensionPolicy
metadata:
  name: external-access-controls
  namespace: nextcloud
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: nextcloud-external
  lua:
    - type: ValueRef
      valueRef:
        group: v1
        kind: ConfigMap
        name: nextcloud-external-access-controls
