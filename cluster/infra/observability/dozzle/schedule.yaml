---
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: dozzle
  namespace: observability
spec:
  podSecurityContext:
    runAsUser: 0
  backend:
    s3:
      bucket: k8up-dozzle
  backup:
    schedule: 0 7 * * 0 # every sunday at 07:00
    successfulJobsHistoryLimit: 1
    failedJobsHistoryLimit: 1
  check:
    schedule: 0 4 * * 1 # every monday at 04:00
    successfulJobsHistoryLimit: 1
    failedJobsHistoryLimit: 1
  prune:
    retention:
      keepDaily: 1
      keepLast: 7
    schedule: 0 10 * * 1 # every monday at 10:00
    successfulJobsHistoryLimit: 1
    failedJobsHistoryLimit: 1
