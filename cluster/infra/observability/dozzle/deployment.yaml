---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dozzle
  namespace: observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: dozzle
      app.kubernetes.io/instance: dozzle
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dozzle
        app.kubernetes.io/instance: dozzle
    spec:
      serviceAccountName: pod-viewer
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dozzle
          image: amir20/dozzle:v10.7.2
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 3
            timeoutSeconds: 1
          livenessProbe:
            tcpSocket:
              port: http
            failureThreshold: 3
            periodSeconds: 30
            timeoutSeconds: 3
          readinessProbe:
            tcpSocket:
              port: http
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 1
          env:
            - name: DOZZLE_MODE
              value: k8s
            - name: DOZZLE_AUTH_PROVIDER
              value: forward-proxy
            - name: DOZZLE_AUTH_HEADER_USER
              value: X-Auth-Request-Email
            - name: DOZZLE_AUTH_HEADER_EMAIL
              value: X-Auth-Request-Email
            - name: DOZZLE_AUTH_HEADER_NAME
              value: X-Auth-Request-Email
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dozzle-data
