---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: intel-gpu-plugin
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: intel-gpu-plugin

  template:
    metadata:
      labels:
        app.kubernetes.io/name: intel-gpu-plugin

    spec:
      nodeSelector:
        kubernetes.io/arch: amd64

      # Start the device plugin as early as possible during node startup.
      priorityClassName: system-node-critical

      automountServiceAccountToken: false

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      initContainers:
        - name: wait-for-gpu
          image: busybox:1.37
          command:
            - sh
            - -ec
            - |
              while true; do
                READY=true

                if ls /dev/dri/renderD* >/dev/null 2>&1; then
                  echo "render node: ready"
                else
                  echo "render node: NOT ready"
                  READY=false
                fi

                if ls /dev/dri/card* >/dev/null 2>&1; then
                  echo "card node: ready"
                else
                  echo "card node: NOT ready"
                  READY=false
                fi

                if find /sys/class/drm -path '*/device/driver' -type l | grep -q .; then
                  echo "driver link: ready"
                else
                  echo "driver link: NOT ready"
                  READY=false
                fi

                if [ "$READY" = "true" ]; then
                  echo "Intel GPU is ready."
                  exit 0
                fi

                sleep 1
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 1m
              memory: 4Mi
            limits:
              cpu: 10m
              memory: 16Mi

          volumeMounts:
            - name: devfs
              mountPath: /dev/dri
              readOnly: true

            - name: sysfs
              mountPath: /sys/class/drm
              readOnly: true

      containers:
        - name: intel-gpu-plugin
          image: intel/intel-gpu-plugin:0.36.0

          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true

          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi

          volumeMounts:
            - name: devfs
              mountPath: /dev/dri
              readOnly: true

            - name: sysfs
              mountPath: /sys/class/drm
              readOnly: true

            - name: kubeletsockets
              mountPath: /var/lib/kubelet/device-plugins

            # Intel GPU plugin writes CDI specifications here.
            - name: cdi
              mountPath: /var/run/cdi

      volumes:
        - name: devfs
          hostPath:
            path: /dev/dri
            type: Directory

        - name: sysfs
          hostPath:
            path: /sys/class/drm
            type: Directory

        - name: kubeletsockets
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory

        - name: cdi
          hostPath:
            path: /var/run/cdi
            type: DirectoryOrCreate
