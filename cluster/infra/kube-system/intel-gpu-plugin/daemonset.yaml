---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: intel-gpu-plugin
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: intel-gpu-plugin

  template:
    metadata:
      labels:
        app.kubernetes.io/name: intel-gpu-plugin

    spec:
      nodeSelector:
        kubernetes.io/arch: amd64

      # Start the device plugin as early as possible during node startup.
      priorityClassName: system-node-critical

      automountServiceAccountToken: false

      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: intel-gpu-plugin
          image: intel/intel-gpu-plugin:0.36.0

          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true

          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi

          volumeMounts:
            - name: devfs
              mountPath: /dev/dri
              readOnly: true

            - name: sysfs
              mountPath: /sys/class/drm
              readOnly: true

            - name: kubeletsockets
              mountPath: /var/lib/kubelet/device-plugins

            # Intel GPU plugin writes CDI specifications here.
            - name: cdi
              mountPath: /var/run/cdi

      volumes:
        - name: devfs
          hostPath:
            path: /dev/dri
            type: Directory

        - name: sysfs
          hostPath:
            path: /sys/class/drm
            type: Directory

        - name: kubeletsockets
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory

        - name: cdi
          hostPath:
            path: /var/run/cdi
            type: DirectoryOrCreate
