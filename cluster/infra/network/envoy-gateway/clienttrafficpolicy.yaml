---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: enable-client-ip-detection
  namespace: network
spec:
  path:
    escapedSlashesAction: KeepUnchanged
  clientIPDetection:
    customHeader:
      name: CF-Connecting-IP
      failClosed: false
  headers:
    earlyRequestHeaders:
      set:
        - name: X-Forwarded-For
          value: "%REQ(CF-CONNECTING-IP)%"
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-external
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: enable-client-ip-detection-internal
  namespace: network
spec:
  path:
    escapedSlashesAction: KeepUnchanged
  clientIPDetection:
    directSourceIP: {}
  headers:
    earlyRequestHeaders:
      set:
        - name: X-Forwarded-For
          value: "%DOWNSTREAM_DIRECT_REMOTE_ADDRESS_WITHOUT_PORT%"
  http3: {}
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-internal
