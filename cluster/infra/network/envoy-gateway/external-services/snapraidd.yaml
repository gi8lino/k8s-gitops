---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: snapraid
  namespace: network
spec:
  endpoints:
    - fqdn:
        hostname: k3s.srv.${BASE_DOMAIN}
        port: 7627
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: snapraid
  namespace: network
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - snapraid.${BASE_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: snapraid
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: envoy-gateway-egress-snapraidd
  namespace: network
spec:
  description: "Policy for envoy-gateway-egress-snapraidd"
  endpointSelector:
    matchLabels:
      gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      gateway.envoyproxy.io/owning-gateway-namespace: network
  egress:
    - toEntities:
        - cluster
      toPorts:
        - ports:
            - port: "7627"
              protocol: TCP
