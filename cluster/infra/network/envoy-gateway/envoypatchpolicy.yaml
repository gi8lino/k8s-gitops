---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyPatchPolicy
metadata:
  name: normalize-external-client-ip-header
  namespace: network
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: envoy-external
  type: JSONPatch
  jsonPatches:
    - type: type.googleapis.com/envoy.config.listener.v3.Listener
      name: network/envoy-external/https
      operation:
        op: add
        path: /filter_chains/0/filters/0/typed_config/request_headers_to_add
        value:
          - header:
              key: x-forwarded-for
              value: "%REQ(CF-CONNECTING-IP)%"
            append_action: OVERWRITE_IF_EXISTS_OR_ADD
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyPatchPolicy
metadata:
  name: normalize-internal-client-ip-header
  namespace: network
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: envoy-internal
  type: JSONPatch
  jsonPatches:
    - type: type.googleapis.com/envoy.config.listener.v3.Listener
      name: network/envoy-internal/https
      operation:
        op: add
        path: /filter_chains/0/filters/0/typed_config/request_headers_to_add
        value:
          - header:
              key: x-forwarded-for
              value: "%DOWNSTREAM_DIRECT_REMOTE_ADDRESS_WITHOUT_PORT%"
            append_action: OVERWRITE_IF_EXISTS_OR_ADD
