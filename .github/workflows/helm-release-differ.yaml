---
name: Helm Release Differ
on: # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - master
    paths:
      - cluster/**
      - .github/workflows/helm-release-differ.yaml
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: helm-diff-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  helm-release-differ:
    name: Helm Release Differ
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Determine comparison base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: echo "FLATE_BASE=$(git merge-base "$BASE_SHA" HEAD)" >> "$GITHUB_ENV"
      - name: Set up flate
        uses: home-operations/flate/action@43b92e26b196c6ca7eb1933b5b2c9074ff0ad1b7 # v0.7.1
        with:
          base: ${{ env.FLATE_BASE }}
          cache: true
      - name: Render HelmRelease diff
        id: diff
        env:
          FLATE_CONCURRENCY: "4"
          FLATE_RESTRICT_EGRESS: "true"
          FLATE_ALLOW_MISSING_SECRETS: "true"
        run: |
          mkdir -p helm-diff
          flate diff hr --path cluster --no-progress -o github > helm-diff/changes.diff
          flate diff hr --path cluster --no-progress -o html > helm-diff/changes.html
      - name: Prepare review summary
        if: always() && steps.diff.outcome != 'skipped'
        env:
          DIFF_OUTCOME: ${{ steps.diff.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p helm-diff
          {
            echo '<!-- flate-helm-diff -->'
            echo '### Rendered HelmRelease diff'
            echo
            echo '> Offline preview: SOPS values are placeholders; unavailable valuesFrom references are omitted. Secrets and CRDs are excluded. This is not a live-cluster comparison.'
            echo
            if [ "$DIFF_OUTCOME" != success ]; then
              echo '**Rendering failed. Any diff below may be incomplete; check the workflow logs.**'
              echo
            fi
            if [ -s helm-diff/changes.diff ]; then
              echo '````diff'
              head -c 45000 helm-diff/changes.diff
              printf '\n````\n'
              if [ "$(wc -c < helm-diff/changes.diff)" -gt 45000 ]; then
                echo 'Preview truncated; download the artifact for the full diff.'
              fi
            elif [ "$DIFF_OUTCOME" = success ]; then
              echo 'No rendered HelmRelease changes detected.'
            fi
            echo
            echo "[Workflow logs and downloadable HTML/full diff]($RUN_URL)"
          } > helm-diff/comment.md
          cat helm-diff/comment.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload full diff and HTML review
        if: always() && steps.diff.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: helm-release-diff
          path: helm-diff/
          retention-days: 7
      - name: Find review comment
        if: always() && steps.diff.outcome != 'skipped' && github.event.pull_request.head.repo.full_name == github.repository
        uses: peter-evans/find-comment@v4
        id: comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: '<!-- flate-helm-diff -->'
      - name: Create or update review comment
        if: always() && steps.diff.outcome != 'skipped' && github.event.pull_request.head.repo.full_name == github.repository
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: helm-diff/comment.md
          edit-mode: replace
