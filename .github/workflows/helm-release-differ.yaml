---
name: Helm Release Differ
on: # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - master
    paths:
      - cluster/apps/**/helmrelease.yaml
      - cluster/infra/**/helmrelease.yaml
permissions:
  contents: read
  pull-requests: write
jobs:
  detect-file-changes:
    name: Detect File Changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Filter Helm Releases
        uses: dorny/paths-filter@v4
        id: filter
        with:
          list-files: json
          filters: |
            yaml:
              - added|modified: "cluster/apps/**/helmrelease.yaml"
              - added|modified: "cluster/infra/**/helmrelease.yaml"
    outputs:
      yaml_files: ${{ steps.filter.outputs.yaml_files }}
  helm-release-differ:
    name: Helm Release Differ
    runs-on: ubuntu-latest
    needs: detect-file-changes
    if: needs.detect-file-changes.outputs.yaml_files != '[]'
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.detect-file-changes.outputs.yaml_files) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: default
      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          # renovate depName=helm/helm
          version: v4.3.1
      - name: Helm Release Differ
        id: diff
        env:
          RELEASE_FILE: ${{ matrix.file }}
        run: |
          bash .github/scripts/helm-release-differ.sh \
            --source-file "default/$RELEASE_FILE" \
            --target-file "$RELEASE_FILE" \
            --remove-common-labels > helm-diff.md
          cat helm-diff.md >> "$GITHUB_STEP_SUMMARY"
      - name: Find Comment
        uses: peter-evans/find-comment@v4
        id: find-comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          issue-number: "${{ github.event.pull_request.number }}"
          comment-author: github-actions[bot]
          body-includes: "${{ matrix.file }}"
      - name: Create or update comment
        uses: peter-evans/create-or-update-comment@v5
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          comment-id: "${{ steps.find-comment.outputs.comment-id }}"
          issue-number: "${{ github.event.pull_request.number }}"
          body-path: helm-diff.md
          edit-mode: replace
