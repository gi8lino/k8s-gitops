---
name: compatibility.fyi gate

"on":
  push:
    branches:
      - "renovate/**"
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

jobs:
  gate:
    permissions:
      contents: read
      statuses: write
    uses: compatibility-fyi/compatibility-gate/.github/workflows/gate.yml@246d580f27aff060e042000cacdcce198381dfdd # v1.1.2
    with:
      mode: ${{ github.event_name == 'push' && 'current' || 'all' }}
