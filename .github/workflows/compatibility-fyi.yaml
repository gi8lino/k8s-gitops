---
name: compatibility.fyi gate

"on":
  push:
    branches:
      - "renovate/**"
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

jobs:
  gate:
    permissions:
      contents: read
      statuses: write
    uses: compatibility-fyi/compatibility-gate/.github/workflows/gate.yml@a6a984bb256567ce77cd6a2d9af5e5435984f98f # v1.2.2
    with:
      mode: ${{ github.event_name == 'push' && 'current' || 'all' }}
