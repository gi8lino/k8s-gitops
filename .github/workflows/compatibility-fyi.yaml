---
name: compatibility.fyi gate
"on":
  push:
    branches:
      - "renovate/**"
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
jobs:
  gate:
    permissions:
      contents: read
      statuses: write
    uses: compatibility-fyi/compatibility-gate/.github/workflows/gate.yml@cefe6fbba731e27d59e56bc837c3a626b7924242 # v1.3.1
    with:
      mode: ${{ github.event_name == 'push' && 'current' || 'all' }}
