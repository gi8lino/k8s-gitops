---
name: compatibility.fyi gate

"on":
  push:
    branches:
      - "renovate/**"
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

jobs:
  gate:
    permissions:
      contents: read
      statuses: write
    uses: compatibility-fyi/compatibility-gate/.github/workflows/gate.yml@6a53cb55a0a52eca73b57efb63d5bafbd72756d9 # v1.2.0
    with:
      mode: ${{ github.event_name == 'push' && 'current' || 'all' }}
