---
name: compatibility.fyi gate

"on":
  push:
    branches:
      - "renovate/**"
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

jobs:
  gate:
    permissions:
      contents: read
      statuses: write
    uses: compatibility-fyi/compatibility-gate/.github/workflows/gate.yml@e0ac1de78bcc1d10e3254740c7786649210f4679 # v1.3.0
    with:
      mode: ${{ github.event_name == 'push' && 'current' || 'all' }}
