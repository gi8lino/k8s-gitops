---
name: compatibility.fyi gate

"on":
  push:
    branches:
      - "renovate/**"
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

jobs:
  gate:
    permissions:
      contents: read
      statuses: write
    uses: compatibility-fyi/compatibility-gate/.github/workflows/gate.yml@77e0438b6c7ffd779e68c46af7f1e9b026b060a7 # v1.2.1
    with:
      mode: ${{ github.event_name == 'push' && 'current' || 'all' }}
